services:
  # 1. Backend Web Service (Django)
  - type: web
    name: vju-onestop-dev
    runtime: python
    plan: free
    branch: feature/fe-be-integration-module1
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vju-onestop-dev-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: GOOGLE_CLIENT_ID
        value: "186840933192-5tp7uos3l3o8hlvgq621i0emi4e8oukr.apps.googleusercontent.com"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "True"
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_STUDENT_EMAILS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://vju-portal-dev.onrender.com"
      - key: VERIFY_BASE_URL
        value: "https://vju-portal-dev.onrender.com/verify/"
      - key: PYTHON_VERSION
        value: "3.12.2"

  # 2. Frontend Static Site (React SPA)
  - type: web
    name: vju-portal-dev
    runtime: static
    branch: feature/fe-be-integration-module1
    rootDir: vju-portal-admin
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "18.20.0"
      - key: REACT_APP_API_BASE_URL
        value: "https://vju-onestop-dev.onrender.com/api"
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: "186840933192-5tp7uos3l3o8hlvgq621i0emi4e8oukr.apps.googleusercontent.com"

databases:
  # 3. PostgreSQL Database
  - name: vju-onestop-dev-db
    databaseName: vju_onestop_dev
    user: vju_dev
    plan: free
