# Blueprint cho môi trường dev từ nhánh feature/fe-be-integration-module1
# Tạo trên Render: New > Blueprint > chọn repo > Blueprint Path = render.dev.yaml

databases:
  - name: vju-onestop-dev-db
    plan: free
    databaseName: vju_onestop_dev
    user: vju_dev

services:
  # Backend API (Django)
  - type: web
    name: vju-onestop-dev
    plan: free
    runtime: python
    branch: feature/fe-be-integration-module1
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vju-onestop-dev-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: GOOGLE_CLIENT_ID
        value: "186840933192-5tp7uos3l3o8hlvgq621i0emi4e8oukr.apps.googleusercontent.com"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "True"
      - key: DEMO_PASSWORD
        sync: false
      # Email Google đăng nhập vai trò sinh viên, cách nhau bằng dấu phẩy
      - key: DEMO_STUDENT_EMAILS
        sync: false
      # URL frontend dev (không có / ở cuối), ví dụ: https://vju-portal-dev.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # <URL frontend>/verify/ — mã QR trên PDF kết quả trỏ về đây
      - key: VERIFY_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.2"

  # Frontend (React SPA)
  - type: web
    name: vju-portal-dev
    runtime: static
    plan: free
    branch: feature/fe-be-integration-module1
    rootDir: vju-portal-admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "18.20.0"
      # <URL backend>/api, ví dụ https://vju-onestop-dev.onrender.com/api
      - key: REACT_APP_API_BASE_URL
        sync: false
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: "186840933192-5tp7uos3l3o8hlvgq621i0emi4e8oukr.apps.googleusercontent.com"
