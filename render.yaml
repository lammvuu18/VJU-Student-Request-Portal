databases:
  - name: vju-onestop-db
    plan: free
    databaseName: vju_onestop
    user: vju_dev

services:
  - type: web
    name: vju-onestop
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vju-onestop-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.2"
