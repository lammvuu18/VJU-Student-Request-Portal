databases:
  - name: vju-onestop-db
    plan: free
    databaseName: vju_onestop
    user: vju_dev

services:
  # Backend API (Django)
  - type: web
    name: vju-onestop
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vju-onestop-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "False"
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_STUDENT_EMAILS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://vju-student-request-portal.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.2"

  # Frontend Portal & Admin Interface (React SPA)
  - type: web
    name: vju-portal-interface
    runtime: static
    plan: free
    branch: interface
    rootDir: vju-portal-admin
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "18.20.0"
      - key: REACT_APP_API_BASE_URL
        value: "https://vju-onestop.onrender.com/api"
