# Blueprint cho môi trường thứ hai (staging), độc lập với render.yaml.
# Tạo trên Render: New > Blueprint > chọn repo > Blueprint Path = render.staging.yaml
# Các biến sync: false sẽ được hỏi khi tạo Blueprint. Hướng dẫn: docs/deploy-render-staging.md

databases:
  - name: vju-onestop-staging-db
    plan: free
    databaseName: vju_onestop_staging
    user: vju_staging

services:
  # Backend API (Django)
  - type: web
    name: vju-onestop-staging
    plan: free
    runtime: python
    branch: develop
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vju-onestop-staging-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "True"
      - key: DEMO_PASSWORD
        sync: false
      # Email Google được đăng nhập vai trò sinh viên, cách nhau bằng dấu phẩy
      - key: DEMO_STUDENT_EMAILS
        value: "guenkokuain020411@gmail.com"
      # URL frontend staging, điền sau khi frontend được tạo (không có dấu / ở cuối)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # <URL frontend>/verify/ — mã QR trên PDF kết quả trỏ về đây
      - key: VERIFY_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.2"

  # Frontend (React SPA)
  - type: web
    name: vju-portal-staging
    runtime: static
    plan: free
    branch: develop
    rootDir: vju-portal-admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "18.20.0"
      # <URL backend>/api, ví dụ https://vju-onestop-staging.onrender.com/api
      - key: REACT_APP_API_BASE_URL
        sync: false
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false
